; Animation Injector — framework settings (applies to every action folder under SKSE\Plugins\AnimationInjector\)
; Animation Injector 프레임워크 설정 (SKSE\Plugins\AnimationInjector\ 아래 모든 액션 폴더에 공통)

[Inject]
; false = skip state injection; file/event registration and installed hooks remain active
; false = 상태 삽입만 생략; 파일·이벤트 등록과 설치된 훅은 계속 동작함
bInjectState = true

; First stateId given to injected states (each state machine hands out the next free ids from here, skipping existing ones, up to 32767)
; 삽입 상태에 주는 첫 stateId (상태머신마다 여기서부터 빈 id 를 차례로 쓰며 기존 id 는 건너뜀, 최대 32767)
iStateIdBase = 7700

; Priority of the injected entry transitions (MCO/BFCO use 5000). Higher = can interrupt lower-priority transitions
; 삽입한 진입 전이의 우선순위 (MCO/BFCO 는 5000). 높을수록 낮은 우선순위 전이를 끊고 들어간다
iWildcardPriority = 5000

; Let the engine turn HKX annotations into events for injected clips (hkanno event slots). false = only "@time" triggers work
; 삽입 클립의 HKX 주석을 엔진이 이벤트로 바꾸게 둔다 (hkanno 이벤트 슬롯). false = "@시각" 트리거만 동작
bConvertAnnotations = true

[Display]
; Show initial preparation once per startup/save load, even when brief; no gameplay popups.
; 게임 시작/세이브 로드의 초기 준비만 짧아도 한 번 표시하며 플레이 중에는 다시 표시하지 않습니다.
bLoadingProgress = true

[Preload]
; Preload ordinary action animations too (paired ones always are) and keep them loaded, as OAR does (Default: true)
; 일반 액션 애니메이션도 미리 불러와 계속 올려 둡니다. 페어 애니메이션은 항상 미리 불러옵니다 (OAR 방식, 기본값: true)
bOrdinary = true

; Size limit of preloaded ordinary animations per project in MB; files past it load when played (Default: 0 = no limit)
; 프로젝트당 미리 불러올 일반 애니메이션 용량 한도(MB). 넘는 파일은 재생할 때 불러옵니다 (기본값: 0 = 제한 없음)
iOrdinaryBudgetMB = 0

[Camera]
; Third-person zoom when an action started in first person switches to third person, used until the player's own
; third-person zoom has been seen (then the last one the player used is kept). The engine's third-person zoom offset;
; the log line "[ViewGuard] third-person zoom" shows the values in use (Default: 0.5)
; 1인칭에서 시작한 동작이 3인칭으로 전환할 때의 줌. 플레이어가 3인칭에서 쓰던 줌을 아직 본 적이 없을 때만 쓰고,
; 그 뒤에는 플레이어가 마지막으로 쓰던 줌을 따릅니다. 엔진의 3인칭 줌 오프셋 값이며,
; 로그 "[ViewGuard] third-person zoom" 줄에 실제로 쓰인 값이 나옵니다 (기본값: 0.5)
fSwitchZoom = 0.5

[Compatibility]
; Native paired-start alignment: 0 = off, 1 = Animation Injector pairs only, 2 = every paired animation (kill moves and other mods too)
; Use 1 with Paired Animation Improvements so the two do not both adjust the same kill move
; The victim keeps its position and only turns toward the attacker; the attacker moves onto its mark
; 네이티브 페어 시작 정렬: 0 = 끔, 1 = Animation Injector 페어만, 2 = 모든 페어 애니메이션 (킬무브·다른 모드 포함)
; 피해자는 제자리에서 가해자 쪽으로 회전만 하고, 가해자가 정해진 자리로 이동
; Paired Animation Improvements와 함께 쓰면 같은 킬무브를 둘이 함께 보정하지 않도록 1을 권장
iNativePairAlignment = 2

; Paired animation end position: an animation that walks the root bone away from the actor snaps the actor back to
; where it started as it ends; the root's last horizontal position is handed to the actor instead.
; 0 = off, 1 = Animation Injector pairs only, 2 = every paired animation (kill moves and other mods too) (Default: 2)
; 페어 애니메이션 종료 위치 보정: 루트 본이 배우에게서 멀어지는 애니메이션은 끝날 때 배우가 시작 위치로 되돌아갑니다.
; 대신 루트의 마지막 수평 위치로 배우를 옮깁니다.
; 0 = 끔, 1 = Animation Injector 페어만, 2 = 모든 페어 애니메이션 (킬무브·다른 모드 포함) (기본값: 2)
iPairEndPosition = 2

[Debug]
; Query a detached collision clone at the native destination before movement; diagnostics only.
; 실제 이동 전 네이티브 목적지에서 충돌 복제본을 조회합니다. 진단 전용입니다.
bSpaceProbe = false
; Record carry physics every step to SKSE\AnimationInjector\RagdollTrace (newest 10) for HKX_Edit calibration.
; 운반 물리를 매 스텝 SKSE\AnimationInjector\RagdollTrace 에 기록합니다(최근 10개). HKX_Edit 보정용입니다.
bRagdollTrace = true
; Verbose log: graph injection details, runner lifecycle, events, hits. Turn on when reporting a problem
; 상세 로그: 그래프 삽입 내역, 실행기 생명주기, 이벤트, 히트. 문제를 보고할 때 켠다
bDebug = true
