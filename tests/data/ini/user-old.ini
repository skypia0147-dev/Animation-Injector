; Animation Injector — framework settings (applies to every action folder)
; Animation Injector 프레임워크 설정 (모든 액션 폴더에 공통)

[Inject]
; false = probe only (self-checks are logged, nothing is inserted into the graph)
; false = 프로브만 (자가검증 로그만 남기고 그래프에 아무것도 넣지 않음)
bInjectState = true

; Base stateId for the 4 dodge states (bumped by +100 if it collides with an existing id)
; 닷지 상태 4개의 stateId 시작값 (기존 id 와 겹치면 +100 씩 올림)
iStateIdBase = 7700


; Priority of the injected wildcard transitions (MCO uses 5000). Higher = can interrupt lower-priority transitions
; 삽입한 와일드카드 전이의 우선순위 (MCO 는 5000). 높을수록 낮은 우선순위 전이를 끊고 들어간다
iWildcardPriority = 5000

; Let the engine turn HKX annotations into triggers/events for injected clips (event-slot model). false = only plugin-made triggers
; 삽입 클립의 HKX 주석을 엔진이 트리거/이벤트로 바꾸게 둔다 (이벤트 슬롯 모델). false = 플러그인이 만든 트리거만
bConvertAnnotations = true
; Fire DirectDodge_Stop this many seconds before the clip ends
; 클립 끝 몇 초 전에 DirectDodge_Stop 을 발화할지
fStopTriggerBeforeEnd = 0.05

[Debug]
; Human arm physics probe: Num7 carry, Num8 rigid/physics, Num9 release.
; 인간 양팔 물리 시험: 키패드7 운반, 8 고정/물리 전환, 9 해제.
bHumanCarryTest = true
; Log paired collision shape queries; diagnostics only.
; 페어 충돌 형상 조회 로그를 기록합니다. 진단 전용입니다.
bSpaceProbe = false
; Read-only paired root snapshots; no position or pose changes.
; 페어 루트 위치 관측만 수행하며 위치와 포즈는 변경하지 않습니다.
bPairRootProbe = false
; Verbose probe logging: clip activation, animation file loader, motion callback
; 프로브 로그: 클립 활성화, 애니메이션 파일 로더, 이동 콜백
bDebug = true
bRagdollTrace = true

[Compatibility]
; Enable native FireArrow integration. Restart required after changes.
; FireArrow 엔진 연동. 변경 후 게임을 다시 시작하세요.
bFireArrow = true
